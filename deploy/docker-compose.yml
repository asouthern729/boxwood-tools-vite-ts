services:
  boxwood-tools:
    image: ghcr.io/asouthern729/boxwood-tools-vite-ts:1.0.0
    restart: unless-stopped
    # Loopback only; the host nginx proxies /tools/ here.
    ports:
      - "127.0.0.1:6000:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/tools/"]
      interval: 30s
      timeout: 3s
      retries: 3
