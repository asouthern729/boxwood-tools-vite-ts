server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build assets never change under the same name.
    location __APP_BASE__assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the SPA shell, which must never be cached so a redeploy is
    # picked up immediately.
    location __APP_BASE__ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ __APP_BASE__index.html;
    }
}
